<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Fitness Planner — Login (Bypass)</title>
  <style>
    :root{--primary:#4361ee;--accent:#f72585;--light:#f8f9fa;--dark:#212529;--gray:#adb5bd}
    *{box-sizing:border-box;font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);color:var(--dark)}
    .card{width:100%;max-width:480px;background:#fff;border-radius:12px;padding:20px;box-shadow:0 10px 30px rgba(30,30,60,0.08)}
    h1{color:var(--primary);margin:0 0 10px}
    label{display:block;font-weight:600;margin-top:10px;color:var(--primary)}
    input{width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;margin-top:6px}
    .actions{display:flex;gap:8px;margin-top:14px;align-items:center}
    .btn{padding:10px 14px;border-radius:8px;border:none;cursor:pointer;font-weight:700}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-ghost{background:transparent;border:1px solid #ddd}
    .msg{margin-top:12px;padding:10px;border-radius:8px}
    .err{background:#fee2e2;color:#b91c1c}
    .ok{background:#ddf7ea;color:#065f46}
    small{display:block;margin-top:10px;color:var(--gray)}
  </style>
</head>
<body>
  <div class="card" role="main">
    <h1>Sign in — AI Fitness Planner</h1>
    <p style="margin:6px 0 14px;color:var(--gray)">This page is temporarily wired to a test bypass endpoint for quick frontend testing.</p>

    <form id="loginForm" autocomplete="on">
      <label for="email">Email</label>
      <input id="email" type="email" required placeholder="test@example.com" value="test@example.com" />

      <label for="password">Password</label>
      <input id="password" type="password" required placeholder="TestPassword123" value="TestPassword123" />

      <div class="actions">
        <button class="btn btn-primary" type="submit" id="btnSubmit">Sign in</button>
        <button type="button" id="btnClear" class="btn btn-ghost">Clear</button>
      </div>

      <div id="message" class="msg" style="display:none"></div>
      <small>Test account: <strong>test@example.com</strong> / <strong>TestPassword123</strong></small>
    </form>
  </div>

  <script>
    // ⚙️ Set your backend base URL here
    const API_BASE_URL = "https://idiet-repo.onrender.com"; // keep this for Render, or use "http://localhost:8000" to test locally

    const form = document.getElementById('loginForm');
    const btn = document.getElementById('btnSubmit');
    const btnClear = document.getElementById('btnClear');
    const msg = document.getElementById('message');

    function showMessage(text, type='err') {
      msg.style.display = 'block';
      msg.textContent = text;
      msg.className = 'msg ' + (type === 'ok' ? 'ok' : 'err');
    }
    function hideMessage() { msg.style.display = 'none'; msg.textContent = ''; msg.className = 'msg'; }

    btnClear.addEventListener('click', () => {
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
      hideMessage();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessage();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) { showMessage('Please enter both email and password'); return; }

      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        // TEMPORARY BYPASS: posts to login-test-bypass on the server
        const res = await fetch(`${API_BASE_URL}/api/auth/login-test-bypass`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const text = await res.text();
        let data = null;
        try { data = JSON.parse(text); } catch (err) { data = null; }

        if (!res.ok) {
          // If server returned JSON error, show it; otherwise show raw body
          const errMsg = data?.error || text || `Server responded ${res.status}`;
          showMessage(errMsg);
          btn.disabled = false;
          btn.textContent = 'Sign in';
          return;
        }

        // success: expect { token, user }
        const token = data?.token || null;
        const user = data?.user || null;

        if (!token) {
          showMessage('No token returned from server (check bypass route).');
          btn.disabled = false;
          btn.textContent = 'Sign in';
          return;
        }

        // Save token & user
        localStorage.setItem('afp_token', token);
        if (user) localStorage.setItem('afp_user', JSON.stringify(user));

        showMessage('Login successful — redirecting...', 'ok');
        btn.textContent = 'Success';

        setTimeout(() => {
          // Redirect to dashboard (or index.html)
          window.location.href = 'dashboard.html';
        }, 800);
      } catch (err) {
        console.error('Login network error', err);
        showMessage('Network error. Check backend URL or connection.');
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
