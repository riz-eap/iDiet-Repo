<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Fitness Planner | Login</title>
  <style>
    :root {
      --primary: #4361ee;
      --secondary: #3a0ca3;
      --accent: #f72585;
      --light: #f8f9fa;
      --dark: #212529;
      --success: #4cc9f0;
      --gray: #adb5bd;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--dark);
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      text-align: center;
      animation: fadeIn 0.4s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      color: var(--secondary);
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-weight: 600;
      color: var(--primary);
      text-align: left;
      margin-top: 1rem;
    }

    input {
      width: 100%;
      padding: 0.7rem;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-top: 0.3rem;
      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(67, 97, 238, 0.2);
    }

    .btn {
      margin-top: 1.5rem;
      width: 100%;
      padding: 0.8rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #d81159;
      transform: translateY(-1px);
    }

    .message {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: var(--danger);
    }

    .success {
      color: green;
    }

    small {
      display: block;
      margin-top: 0.5rem;
      color: var(--gray);
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Login to AI Fitness Planner</h2>
    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" placeholder="Enter your email" required />
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password" required />
      <button type="submit" class="btn">Login</button>
      <div class="message" id="message"></div>
      <small>Test Account: test@example.com / TestPassword123</small>
    </form>
  </div>

  <script>
    // ⚙️ CHANGE THIS LINE BELOW TO YOUR REAL BACKEND URL
    const API_BASE_URL = "https://idiet-repo.onrender.com"; // example Render backend
    // const API_BASE_URL = "http://localhost:8000"; // uncomment if testing locally

    const form = document.getElementById("loginForm");
    const msg = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";
      msg.style.color = "black";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) {
        msg.textContent = "Please fill all fields.";
        msg.style.color = "red";
        return;
      }

      try {
        msg.textContent = "Logging in...";
        const res = await fetch(`${API_BASE_URL}/api/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          msg.textContent = data.error || "Login failed. Please check credentials.";
          msg.style.color = "red";
          return;
        }

        // Save token & user to localStorage
        localStorage.setItem("afp_token", data.token);
        localStorage.setItem("afp_user", JSON.stringify(data.user));

        msg.textContent = "Login successful! Redirecting...";
        msg.classList.add("success");

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1000);
      } catch (err) {
        console.error(err);
        msg.textContent = "Network error. Check backend URL or connection.";
        msg.style.color = "red";
      }
    });
  </script>
</body>
</html>
