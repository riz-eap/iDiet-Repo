<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login • AI Fitness Planner</title>
  <style>
    :root {
      --primary: #4361ee;
      --secondary: #3a0ca3;
      --accent: #f72585;
      --light: #f8f9fa;
      --dark: #212529;
      --gray: #adb5bd;
      --muted: #6c757d;
    }
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: var(--dark);
    }
    .login-card {
      background: #fff;
      padding: 30px 25px;
      border-radius: 12px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 400px;
    }
    .login-card h1 {
      margin: 0;
      text-align: center;
      color: var(--secondary);
      font-size: 1.6rem;
    }
    .login-card p {
      text-align: center;
      color: var(--muted);
      margin-bottom: 25px;
    }
    .input-group {
      margin-bottom: 15px;
    }
    label {
      font-size: 0.9rem;
      color: var(--muted);
      display: block;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
    }
    .btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 1rem;
      margin-top: 10px;
    }
    .btn:hover {
      background: var(--secondary);
    }
    .message {
      text-align: center;
      font-size: 0.9rem;
      margin-top: 10px;
      border-radius: 6px;
      padding: 8px;
      display: none;
    }
    .message.ok {
      background: #e6ffef;
      color: #065f46;
      display: block;
    }
    .message.error {
      background: #fdecea;
      color: #9b1c1c;
      display: block;
    }
    .footer {
      text-align: center;
      margin-top: 15px;
      color: var(--gray);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>AI Fitness Planner</h1>
    <p>Login to your account</p>
    <form id="login-form">
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com" />
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          required
          placeholder="Enter your password"
        />
      </div>
      <button type="submit" class="btn">Login</button>
    </form>
    <div id="message" class="message"></div>
    <div class="footer">© 2025 AI Fitness Planner</div>
  </div>

  <script>
    const API_BASE_URL = "https://idiet-repo.onrender.com";
    const form = document.getElementById("login-form");
    const messageEl = document.getElementById("message");

    function showMessage(text, type = "ok") {
      messageEl.textContent = text;
      messageEl.className = "message " + type;
    }

    async function safeFetchJson(url, opts = {}) {
      try {
        const res = await fetch(url, opts);
        const text = await res.text();
        let json = null;
        try {
          json = text ? JSON.parse(text) : null;
        } catch {
          json = null;
        }
        return { ok: res.ok, status: res.status, json, text };
      } catch (err) {
        return { error: err.message };
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) {
        showMessage("Please enter both email and password.", "error");
        return;
      }

      showMessage("Logging in...", "ok");

      // Attempt normal backend login
      const result = await safeFetchJson(`${API_BASE_URL}/api/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });

      if (result.error || result.status === 404) {
        console.warn("Backend login failed, applying bypass mode");
        // If the backend route is missing, bypass login
        localStorage.setItem("afp_token", "bypass-demo-token");
        localStorage.setItem("afp_user", JSON.stringify({ email }));
        showMessage("Login bypassed (demo mode). Redirecting...", "ok");
        setTimeout(() => (window.location.href = "index.html"), 1200);
        return;
      }

      if (!result.ok) {
        showMessage(`Login failed: ${result.status}`, "error");
        return;
      }

      // Success from backend
      const data = result.json || {};
      const token = data.token || "demo-token";
      const user = data.user || { email };

      localStorage.setItem("afp_token", token);
      localStorage.setItem("afp_user", JSON.stringify(user));
      showMessage("Login successful! Redirecting...", "ok");
      setTimeout(() => (window.location.href = "index.html"), 1200);
    });
  </script>
</body>
</html>
