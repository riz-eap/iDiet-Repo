<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Fitness Planner — Login</title>
  <style>
    :root{--primary:#4361ee;--accent:#f72585;--light:#f8f9fa;--dark:#212529;--gray:#adb5bd}
    *{box-sizing:border-box;font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);color:var(--dark)}
    .card{width:100%;max-width:480px;background:#fff;border-radius:12px;padding:20px;box-shadow:0 10px 30px rgba(30,30,60,0.08)}
    h1{color:var(--primary);margin:0 0 10px}
    label{display:block;font-weight:600;margin-top:10px;color:var(--primary)}
    input{width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;margin-top:6px}
    .actions{display:flex;gap:8px;margin-top:14px;align-items:center}
    .btn{padding:10px 14px;border-radius:8px;border:none;cursor:pointer;font-weight:700}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-ghost{background:transparent;border:1px solid #ddd}
    .msg{margin-top:12px;padding:10px;border-radius:8px}
    .err{background:#fee2e2;color:#b91c1c}
    .ok{background:#ddf7ea;color:#065f46}
    small{display:block;margin-top:10px;color:var(--gray)}
  </style>
</head>
<body>
  <div class="card" role="main">
    <h1>Sign in — AI Fitness Planner</h1>
    <p style="margin:6px 0 14px;color:var(--gray)">Use the test account while developing.</p>

    <form id="loginForm" autocomplete="on">
      <label for="email">Email</label>
      <input id="email" type="email" required placeholder="test@example.com" value="test@example.com" />

      <label for="password">Password</label>
      <input id="password" type="password" required placeholder="TestPassword123" value="TestPassword123" />

      <div class="actions">
        <button class="btn btn-primary" type="submit" id="btnSubmit">Sign in</button>
        <button type="button" id="btnClear" class="btn btn-ghost">Clear</button>
      </div>

      <div id="message" class="msg" style="display:none"></div>
      <small>Test account: <strong>test@example.com</strong> / <strong>TestPassword123</strong></small>
    </form>
  </div>

  <!-- API base selector (auto chooses local or deployed) -->
  <script>
    // Adjust if your deployed backend is different
    window.API_BASE_URL = (function(){
      try {
        var host = location.hostname;
        if (host === 'localhost' || host === '127.0.0.1') return 'http://localhost:8000';
        return 'https://idiet-repo.onrender.com';
      } catch(e) { return 'https://idiet-repo.onrender.com'; }
    })();

    // Toggle: if true, login will fallback to login-test-bypass when real endpoint fails (dev only)
    window.DEV_BYPASS = true;
  </script>

  <script>
    (function(){
      const form = document.getElementById('loginForm');
      const btn = document.getElementById('btnSubmit');
      const btnClear = document.getElementById('btnClear');
      const msg = document.getElementById('message');

      function showMessage(text, ok){
        msg.style.display = 'block';
        msg.textContent = text;
        msg.className = 'msg ' + (ok ? 'ok' : 'err');
      }
      function hideMessage(){ msg.style.display='none'; msg.textContent=''; msg.className='msg'; }

      btnClear.addEventListener('click', () => {
        document.getElementById('email').value = '';
        document.getElementById('password').value = '';
        hideMessage();
      });

      async function postJson(url, body){
        try {
          const res = await fetch(url, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body) });
          const text = await res.text();
          let json = null;
          try { json = text ? JSON.parse(text) : null; } catch(e){ json = null; }
          return { ok: res.ok, status: res.status, json: json, text };
        } catch (err) {
          return { error: String(err) };
        }
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideMessage();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) { showMessage('Enter both email and password'); return; }

        btn.disabled = true;
        btn.textContent = 'Signing in...';

        // Try real login endpoint
        const loginUrl = window.API_BASE_URL + '/api/auth/login';
        const res = await postJson(loginUrl, { email, password });

        // if network error or 404/401 and DEV_BYPASS enabled, try bypass
        if ((res.error || !res.ok) && window.DEV_BYPASS) {
          // try bypass endpoint
          const bypass = await postJson(window.API_BASE_URL + '/api/auth/login-test-bypass', { email, password });
          if (bypass && bypass.ok && bypass.json && bypass.json.token) {
            // store token as plain string
            localStorage.setItem('afp_token', bypass.json.token);
            localStorage.setItem('afp_user', JSON.stringify(bypass.json.user || null));
            showMessage('Signed in (bypass). Redirecting...', true);
            setTimeout(()=> window.location.href = 'index.html', 600);
            return;
          }
        }

        if (res.error) {
          showMessage('Network error: ' + res.error);
          btn.disabled = false; btn.textContent = 'Sign in';
          return;
        }
        if (!res.ok) {
          // show server message if present
          const text = res.json && res.json.error ? res.json.error : (res.text || ('Server responded ' + res.status));
          showMessage(text);
          btn.disabled = false; btn.textContent = 'Sign in';
          return;
        }

        // success - expect { token: string, user: object }
        const token = res.json && res.json.token ? res.json.token : null;
        const user = res.json && res.json.user ? res.json.user : null;
        if (!token) {
          showMessage('No token returned from server');
          btn.disabled = false; btn.textContent = 'Sign in';
          return;
        }
        localStorage.setItem('afp_token', token);                  // plain string
        localStorage.setItem('afp_user', JSON.stringify(user || null));
        showMessage('Login successful — redirecting...', true);
        btn.textContent = 'Success';
        setTimeout(()=> window.location.href = 'index.html', 600);
      });
    })();
  </script>
</body>
</html>
